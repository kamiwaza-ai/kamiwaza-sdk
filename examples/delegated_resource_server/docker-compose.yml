services:
  document-resource:
    build:
      context: ../..
      dockerfile: examples/delegated_resource_server/Dockerfile
    ports:
      - "8080"
    environment:
      KAMIWAZA_DELEGATED_CORE_URL: ${KAMIWAZA_DELEGATED_CORE_URL:?required}
      RESOURCE_AUDIENCE: ${RESOURCE_AUDIENCE:-https://documents.example.test}
      RESOURCE_REGISTRATION_REVISION_ID: ${RESOURCE_REGISTRATION_REVISION_ID:?required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

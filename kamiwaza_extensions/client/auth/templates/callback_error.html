<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login failed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 420px;
      text-align: center;
    }
    .logo { height: 32px; margin-bottom: 1.5rem; }
    .icon { color: #ef4444; font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9375rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://www.kamiwaza.ai/hubfs/logo-light.svg" alt="Kamiwaza">
    <div class="icon">✕</div>
    <h1>Login failed{{bucket_label}}</h1>
    <p>{{error}}</p>
  </div>
</body>
</html>

name: Extension Starter Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'kamiwaza_extensions/templates/app/**'
      - 'kamiwaza_extensions/payload_builder.py'
      - 'kamiwaza_extensions/scaffolder.py'
      - 'kamiwaza_extensions/commands/update.py'
      - 'kamiwaza_extensions/template_manifest.py'
      - 'kamiwaza_extensions/compatibility.json'
      - 'kamiwaza_extensions/sdk_override/**'
      - 'examples/chatbot-app/**'
      - 'kamiwaza_extensions_lib/**'
      - 'kamiwaza-ai-extensions-lib/**'
      - 'docs/extensions/runtime-path/routing-vectors.json'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'Makefile'
      - 'scripts/test-next-runtime-canary.sh'
      - 'tests/next-runtime-canary/**'
      - 'tests/unit/extensions/test_app_starter_smoke.py'
      - 'tests/unit/extensions/test_payload_builder.py'
      - 'tests/unit/extensions/test_scaffolder.py'
      - 'tests/integration/test_scaffolded_next_runtime.py'
      - '.github/workflows/extension-starter-smoke.yml'
  push:
    branches: [develop, main]
    paths:
      - 'kamiwaza_extensions/templates/app/**'
      - 'kamiwaza_extensions/payload_builder.py'
      - 'kamiwaza_extensions/scaffolder.py'
      - 'kamiwaza_extensions/commands/update.py'
      - 'kamiwaza_extensions/template_manifest.py'
      - 'kamiwaza_extensions/compatibility.json'
      - 'kamiwaza_extensions/sdk_override/**'
      - 'examples/chatbot-app/**'
      - 'kamiwaza_extensions_lib/**'
      - 'kamiwaza-ai-extensions-lib/**'
      - 'docs/extensions/runtime-path/routing-vectors.json'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'Makefile'
      - 'scripts/test-next-runtime-canary.sh'
      - 'tests/next-runtime-canary/**'
      - 'tests/unit/extensions/test_app_starter_smoke.py'
      - 'tests/unit/extensions/test_payload_builder.py'
      - 'tests/unit/extensions/test_scaffolder.py'
      - 'tests/integration/test_scaffolded_next_runtime.py'
      - '.github/workflows/extension-starter-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Starter Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.5"
          enable-cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: uv sync

      - name: Verify the built wheel scaffolds and validates
        run: |
          uv build --wheel --package kamiwaza-extensions-lib --out-dir "$RUNNER_TEMP/wheels"
          uv build --wheel --package kamiwaza-sdk --out-dir "$RUNNER_TEMP/wheels"
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install \
            --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$RUNNER_TEMP"/wheels/*.whl
          mkdir "$RUNNER_TEMP/wheel-scaffold"
          cd "$RUNNER_TEMP/wheel-scaffold"
          "$RUNNER_TEMP/wheel-venv/bin/kz-ext" create --type app --name wheel-canary
          "$RUNNER_TEMP/wheel-venv/bin/kz-ext" validate .
          grep -q 'index-next-runtime.mjs' frontend/Dockerfile
          grep -q '"next": "15.5.24"' frontend/package.json
          grep -Fqx 'node_modules' frontend/.dockerignore
          grep -Fqx '.next' frontend/.dockerignore
          grep -Fqx '.env*' frontend/.dockerignore
          grep -Fqx '.git' frontend/.dockerignore

      - name: Run scaffold regression and smoke tests
        run: >-
          uv run pytest
          tests/unit/extensions/test_scaffolder.py
          tests/unit/extensions/test_app_starter_smoke.py
          tests/unit/extensions/test_payload_builder.py

      - name: Run TypeScript runtime tests and build
        working-directory: kamiwaza-ai-extensions-lib
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Run pinned Next runtime canary
        run: make test-next-runtime-canary

      - name: Run generated runtime-path canary
        env:
          KZ_REQUIRE_NEXT_RUNTIME_E2E: "1"
        run: uv run pytest tests/integration/test_scaffolded_next_runtime.py

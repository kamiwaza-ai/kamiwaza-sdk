name: Python Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - '.github/workflows/python-coverage.yml'
  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/**'
      - '.github/workflows/python-coverage.yml'

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    env:
      # On push events there is no pull_request context, so base.sha is empty;
      # fall back to the pre-push tip (github.event.before) so the changed-file
      # diff resolves on both event types.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Get changed Python source files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA"..HEAD | grep '\.py$' | grep -v __pycache__ | grep '^kamiwaza_sdk/' | grep -v test_ || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No source files changed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed source files:"
            echo "$CHANGED_FILES"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests with coverage
        if: steps.changed-files.outputs.has_changes == 'true'
        # Restore the 80% gate tracked by ENG-5324; the normal offline suite
        # measures 85% coverage with the validation-provider contracts included.
        # Match make test's offline suite: contract tests own coverage for
        # validation providers and other SDK boundaries (ENG-11687).
        run: |
          uv run pytest -m "not integration and not live and not e2e" \
            --cov=kamiwaza_sdk \
            --cov-report=term-missing \
            --cov-report=json \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage report
        if: steps.changed-files.outputs.has_changes == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json
          retention-days: 7

      - name: No source files changed
        if: steps.changed-files.outputs.has_changes != 'true'
        run: echo "No source files changed - skipping coverage check"

# ENG-12327 (T09). Deploys a llama.cpp GGUF target: the explicit fleet target
# when one is set, else GGUF_LLM_TARGET; an explicit target on another engine
# skips the test as not applicable. Before anything is created the test checks
# that the target's weights and at least one model config are already on the
# cluster; a missing prerequisite skips an optional target and fails a
# fleet-required one, and no SDK download method is called. Every run makes a
# fresh deployment, so the test cannot pass on a warm cluster without
# deploying, and the deployment is checked to carry the requested config,
# weights file and engine. The test creates, reads, lists and updates a
# disposable model config, deploys with it to DEPLOYED, checks the deployment,
# active listing and instances, serves one chat completion through the
# deployment (the reply must contain the sum of two per-run numbers, which the
# prompt does not), reads captured logs and the log stream, stops it without
# force to STOPPED, and deletes the config. The chat call shows the deployment
# serves; it does not claim models.openai-compatible-inference, whose document
# allows a pass only with a representative call per declared operation (chat,
# embeddings, transcription, image generation), which develop's capability map
# enforces since ENG-12269.
- pattern: "tests/integration/test_model_deployment_lifecycle_live.py::test_model_config_and_local_deployment_lifecycle"
  capability_ids: [models.local-deployment]
  scenario_name: "Model config and local deployment lifecycle through the SDK"
  evidence_provenance: cycle-authored

# The two catalog ingest-to-retrieval tests are mapped separately under the
# PER-TEST RULE. Each writes its own run-unique parquet object, ingests exactly
# that object with ingestion.run_active, and reads the dataset back through
# catalog.datasets.get before deleting the dataset, the object, and the catalog
# secret and proving each absent. They differ in how the rows come back.
#
# The inline test retrieves through retrieval.create_job/get_job with the inline
# transport and requires COMPLETED, the exact seeded rows, and the job's
# processed-row count. Returned rows meet the retrieval bar in the
# test_retrieval_live.py note above, so it claims both capabilities. A run
# without the gRPC test can therefore report retrieval as passing from this
# inline slice alone; Arrow Flight is evidenced only by the gRPC entry below. The
# record still fails if the test's inline retrieval or its cleanup of the
# dataset, object, or secret fails, because a record reflects the whole test.
# It is deliberately not modelled as an incomplete operation set (ENG-12269's
# unverified_operations, which fails the record): like the multi-source entry,
# the inline slice earns the retrieval claim, and Arrow Flight gets its own
# record instead.
- pattern: "tests/integration/test_catalog_ingest_retrieval.py::test_s3_ingest_and_retrieve_inline"
  capability_ids: [catalog.dataset-registry, retrieval.async-retrieval-jobs]
  scenario_name: "Catalog S3 dataset registration, inline retrieval, and deletion"
  evidence_provenance: cycle-authored

# The gRPC test creates a grpc-transport retrieval job, requires the arrow-flight
# handshake, reads the seeded rows over Arrow Flight with flight_batches, and
# requires the job to reach COMPLETED. It is the only T01 test that exercises
# Arrow Flight, and its own entry gives the Flight leg a separate record, so a
# Flight failure stays visible beside a passing inline record.
- pattern: "tests/integration/test_catalog_ingest_retrieval.py::test_s3_ingest_and_retrieve_grpc"
  capability_ids: [retrieval.async-retrieval-jobs]
  scenario_name: "Arrow Flight retrieval of an ingested S3 dataset"
  evidence_provenance: cycle-authored


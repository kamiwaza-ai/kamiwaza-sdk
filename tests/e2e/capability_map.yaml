# Capability map for pre-existing e2e/live evidence (ENG-10026, T3.7).
#
# RULE: this mapping is EXPLICIT, REVIEWED, and NEVER INFERRED. An entry
# exists only where the named tests genuinely exercise the capability
# end-to-end against a running platform; tests not matched by any entry
# emit NO evidence. Adding an entry is a reviewed change, not something
# tooling derives from test names.
#
# Each entry is {pattern, capability_ids, scenario_name} plus optional
# {exclude}:
#   * pattern — a pytest nodeid glob (fnmatch, rooted at the repo root,
#     e.g. "tests/integration/test_x.py::*"), or "marker:<name>" to match
#     every test carrying that pytest marker.
#   * capability_ids — capability-document ids (kit inventory, dot-namespaced)
#     the matched tests evidence.
#   * scenario_name — human-readable scenario title; its slug becomes the
#     emitted record's scenario_id.
#   * exclude — nodeid globs carved back out of a broad pattern.
#
# THE PER-TEST RULE: a record is composed from whichever matched tests
# actually ran, so *every* test an entry matches must, on its own, exercise
# the capability. A module-wide "::*" pattern therefore needs `exclude` for
# the module's negative-path tests (get/delete-nonexistent, rejection
# assertions) and availability-only tests: running just one of those must
# never be able to emit a passing record for the capability.
#
# With `--emit-evidence` (and a --build/KAMIWAZA_BUILD identity) the
# emitter in tests/e2e/_evidence_emitter.py writes one scenario-evidence.v2
# record per entry that had at least one matched test actually run, with
# evidence_provenance "pre-existing" unless the entry declares otherwise.
# An entry may set `evidence_provenance: cycle-authored` when the test it
# names was written within the cycle to evidence the capability rather than
# harvested from coverage that already existed. The accepted values are the
# schema's own (harness.EVIDENCE_PROVENANCES); anything else is a refusal.
#
# DELIBERATELY UNMAPPED (reviewed 2026-08-10; empty mapping is the honest
# answer — do not "fix" without new tests):
#   * models.external-endpoints — no existing e2e/live test registers or
#     exercises an external/BYO OpenAI-compatible endpoint.
#   * context.workroom-document-search — the search/retrieve/agentic-search
#     contract tests run against `search_contract_vectordb`, whose own
#     docstring says it exists to give them a CLEAN backend so that "earlier
#     vector insert/query tests cannot leave collections that turn a shape
#     check into a data-search assertion". They search a deliberately empty
#     vectordb and assert only isinstance(results, list), so they pass without
#     finding anything; the vectordb insert/query tests likewise assert only
#     that the result is a list. No existing test searches indexed content and
#     asserts what came back, so this capability has no honest mapping until
#     one is written.
#   * auth.enterprise-sso — test_auth_live.py covers password + PAT auth
#     and test_auth_endpoints_live.py the auth endpoint surface; neither
#     is an enterprise SSO/IdP login. The federation shared-IdP suites
#     (test_federation_idp_lifecycle_live.py, ..._shared_idp_gated_...)
#     provision Keycloak trust for FEDERATION, not enterprise SSO sign-in.
#   * tests/e2e/scenarios/test_s1..s5 drivers — they already emit native
#     scenario-evidence.v2 records through the harness (cycle-authored);
#     mapping them here would double-count the same runs.
#   * test_jobs_recoverable_drop_recovery.py — NOT evidence for
#     federation.remote-jobs: its own docstring says it is a unit-style
#     test mocked at the _request boundary, no remote execution happens.
#   * test_serving_endpoints_live.py — reads serving status/health/logs of
#     whatever is already deployed; it observes but does not demonstrate
#     models.local-deployment, so it stays unmapped.
#   * test_retrieval_live.py — TestRetrievalJobOperations::test_create_and_get_job
#     does create a real job and poll it, but its status assertion is
#     `isinstance(status, str)`, so a job that ran and FAILED passes. Every
#     test under the retained retrieval entries below asserts a real
#     retrieval *artifact* instead — rows returned (row_count > 0), SSE events
#     emitted, or a gRPC transport handshake — which is strictly stronger;
#     mapping this one alongside them would only weaken the claim, so
#     retrieval.async-retrieval-jobs rests on those instead.
#   * test_kaizen_agent_contract_live.py — NOT evidence for
#     kaizen.custom-agents. test_canonical_agent_create_accepts_the_content_contract
#     creates, lists, and deletes a canonical agent, but the capability
#     document names `bind_skill` as "what makes an agent specialised rather
#     than a renamed default assistant", and no test here binds a skill. A
#     create/list/delete pass would emit a record asserting the whole
#     capability, so the mapping would over-claim. Map it once a test binds a
#     library skill and verifies it; the model-setting shape probes and the
#     legacy-body rejection test stay unmapped regardless, since neither
#     creates a supported custom agent.
#   * test_context_workroom_scope_clients_isolate_vectordb_views — NOT
#     evidence for workrooms.session-scoping despite its name. Its own
#     docstring is the accurate one ("Derived SDK clients can carry workroom
#     scope as a context manager"): it creates ONE workroom and ONE scoped
#     client, then asserts the vectordb it made is listed and carries that
#     workroom_id. No enter/leave or 403 denial — it cannot establish
#     workrooms.session-scoping.
#   * test_connector_spec_live.py — NOT evidence for
#     connectors.managed-data-sources. register_from_spec creates a catalog
#     dataset URN under /catalog and does not exercise the documented
#     /connectors type/config lifecycle, availability, or verification.

# ENG-12269: these warm-cluster tests can return before a download starts.
# Restore a models.discover-and-download mapping only for a cold-cluster test
# that initiates, polls, and verifies acquisition in the same run.

# ENG-12269: the tests below prove individual chat or image paths, not every
# operation declared by models.openai-compatible-inference (chat, embeddings,
# transcription, image generation). Only the explicit incomplete-operation
# entry below may name the broad capability, and it must emit failed evidence
# with skip reasons until all required operations are exercised together.

# Justification: test_deploy_mlx_qwen_and_infer_with_strip_thinking deploys
# the default and strip-thinking MLX configs sequentially, waits and infers
# through client.openai.get_client(...) chat completions, then cleans up.
- pattern: "tests/integration/test_serving_workflow.py::test_deploy_mlx_qwen_and_infer_with_strip_thinking"
  capability_ids: [models.local-deployment]
  scenario_name: "Deploy model locally and infer via OpenAI-compatible client"

# Justification: the deployment assertion proves the SDK-created model config
# routes to DiffusionEngine and reaches DEPLOYED with live instances.
- pattern: "tests/integration/test_diffusion_live.py::test_diffusion_deployment_routes_through_sdk"
  capability_ids: [models.local-deployment]
  scenario_name: "Deploy a cross-platform diffusion model through the SDK"

# Justification: this test calls client.openai.get_client(...).images.generate,
# requests two real images with Kamiwaza extension controls, decodes the returned
# base64 and verifies both PNG dimensions. Fake mode is explicit and defaults off.
- pattern: "tests/integration/test_diffusion_live.py::test_diffusion_generates_base64_pngs_with_extension_controls"
  capability_ids: [models.local-deployment]
  scenario_name: "Generate images through the OpenAI-compatible SDK client"

# Justification: accelerated live targets prove both the Qwen text-to-image
# pipeline and Qwen Image Edit with an actual source/mask pair. PNGs and the
# redacted request/response manifest are retained as user-space evidence.
- pattern: "tests/integration/test_diffusion_qwen_live.py::*"
  capability_ids: [models.local-deployment]
  scenario_name: "Generate and mask-edit images with Qwen through the SDK"

# Justification: on a cluster reporting two or more NVIDIA GPUs, this deploys
# the DFloat11 Qwen artifact with gpu_count=2, generates an image, and requires
# runtime attestation that the transformer head/tail occupy distinct devices.
- pattern: "tests/integration/test_diffusion_qwen_split_live.py::*"
  capability_ids: [models.local-deployment]
  scenario_name: "Certify Qwen split-tensor inference across two NVIDIA GPUs"

# ENG-12269: the llama.cpp test deploys and serves one real chat request,
# establishing local deployment. The former module glob grouped independent
# GPU/co-location tests; on Azure only chat ran, yet the passing record named
# the broader OpenAI-compatible inference capability, whose document requires
# chat, embeddings, transcription, and image generation. Keep its status
# failed with explicit missing-operation steps until one scenario proves all.
- pattern: "tests/integration/test_inference_matrix_live.py::test_deploy_and_infer_llamacpp_gguf"
  capability_ids: [models.local-deployment]
  scenario_name: "Deploy llama.cpp model locally and serve chat"

# The same chat run is a valid *attempt* at the inference operation set but
# cannot pass it. The emitter adds named skipped steps for the absent required
# operations and derives failed, preserving a reviewable reasoned record.
- pattern: "tests/integration/test_inference_matrix_live.py::test_deploy_and_infer_llamacpp_gguf"
  capability_ids: [models.openai-compatible-inference]
  scenario_name: "OpenAI-compatible inference operation set"
  unverified_operations: [embeddings, transcription, image_generation]

# The two catalog ingest-to-retrieval tests are mapped separately under the
# PER-TEST RULE. Each writes its own run-unique parquet object, ingests exactly
# that object with ingestion.run_active, and reads the dataset back through
# catalog.datasets.get before deleting the dataset, the object, and the catalog
# secret and proving each absent. They differ in how the rows come back.
#
# The inline test retrieves through retrieval.create_job/get_job with the inline
# transport and requires COMPLETED, the exact seeded rows, and the job's
# processed-row count. Returned rows meet the retrieval bar in the
# test_retrieval_live.py note above, so it claims both capabilities. A run
# without the gRPC test can therefore report retrieval as passing from this
# inline slice alone; Arrow Flight is evidenced only by the gRPC entry below. The
# record still fails if the test's inline retrieval or its cleanup of the
# dataset, object, or secret fails, because a record reflects the whole test.
# It is deliberately not modelled as an incomplete operation set (ENG-12269's
# unverified_operations, which fails the record): like the multi-source entry,
# the inline slice earns the retrieval claim, and Arrow Flight gets its own
# record instead.
- pattern: "tests/integration/test_catalog_ingest_retrieval.py::test_s3_ingest_and_retrieve_inline"
  capability_ids: [catalog.dataset-registry, retrieval.async-retrieval-jobs]
  scenario_name: "Catalog S3 dataset registration, inline retrieval, and deletion"
  evidence_provenance: cycle-authored

# The gRPC test creates a grpc-transport retrieval job, requires the arrow-flight
# handshake, reads the seeded rows over Arrow Flight with flight_batches, and
# requires the job to reach COMPLETED. It is the only T01 test that exercises
# Arrow Flight, and its own entry gives the Flight leg a separate record, so a
# Flight failure stays visible beside a passing inline record.
- pattern: "tests/integration/test_catalog_ingest_retrieval.py::test_s3_ingest_and_retrieve_grpc"
  capability_ids: [retrieval.async-retrieval-jobs]
  scenario_name: "Arrow Flight retrieval of an ingested S3 dataset"
  evidence_provenance: cycle-authored

# Justification: test_catalog_dataset_lifecycle registers a dataset, reads it
# back through the catalog, and verifies its path/location metadata.
- pattern: "tests/integration/test_catalog_live.py::test_catalog_dataset_lifecycle"
  capability_ids: [catalog.dataset-registry]
  scenario_name: "Catalog dataset registration and readback"

# The dedicated secret lifecycle test creates a governed secret through
# SecretClient, reads and lists it, requires deletion to succeed, then proves
# the deleted secret is no longer readable. Dataset setup is deliberately
# absent so an unrelated dataset failure cannot determine this record.
# Deliberately stricter than its sibling test_catalog_secret_list, which skips
# when a new secret is missing from the listing: a skip is a reasonable way to
# tolerate a known server defect in a coverage test, but this entry EMITS
# EVIDENCE, and a capability cannot be established by a run that declined to
# check it. A listing timeout here is therefore a failed lifecycle, and the
# record says so.
- pattern: "tests/integration/test_catalog_live.py::test_catalog_secret_lifecycle"
  capability_ids: [catalog.secrets-management]
  scenario_name: "Catalog governed secret lifecycle"
  evidence_provenance: cycle-authored

# A real PAT is created for the authenticated user, used by a fresh SDK client
# to retrieve that same user's profile, revoked, and then proven unusable. The
# password-only sibling test does not establish this capability and remains
# unmapped.
- pattern: "tests/integration/test_auth_live.py::test_pat_lifecycle_supports_api_key_auth"
  capability_ids: [auth.personal-access-tokens]
  scenario_name: "Personal access token authentication and revocation"

# Justification: dataset schema/variant endpoints, container list/URN/path/v2
# endpoints, and secret endpoints — the catalog registry API surface
# (test_catalog_dataset_schema_endpoints, test_catalog_dataset_variant_endpoints,
# test_catalog_container_by_urn_and_path_endpoints, ...).
# Excluded: test_catalog_metadata_and_health reads service health, and the two
# secret tests manipulate only catalog secrets — none of them registers or
# reads a dataset or container. The non-admin container-list test now provides
# positive evidence for this capability.
- pattern: "tests/integration/test_catalog_endpoints.py::*"
  capability_ids: [catalog.dataset-registry]
  scenario_name: "Catalog dataset and container endpoint surface"
  exclude:
    - "*::test_catalog_metadata_and_health"
    - "*::test_catalog_secret_list"
    - "*::test_catalog_secret_endpoints"

# Justification: every test in the module ingests from some source
# (file/object/parquet/postgres/kafka/slack) and asserts the resulting
# dataset's catalog metadata, so the whole module evidences the registry.
# Split from the retrieval entry below: `exclude` is per-entry, so a single
# entry claiming two capabilities cannot satisfy the per-test rule for both.
- pattern: "tests/integration/test_catalog_multi_source.py::*"
  capability_ids: [catalog.dataset-registry]
  scenario_name: "Multi-source catalog ingestion"

# Justification: the subset that actually submits a retrieval job over the
# ingested data and asserts the result — the two *_inline_retrieval tests,
# inline_small_object and file_ingestion_metadata (both POST /retrieval/jobs
# and assert row_count), large_object_sse_retrieval, and
# postgres_ingestion_metadata.
# Excluded: kafka (xfails before any retrieval), slack, and container_link
# never submit a job at all, and inline_large_object_hits_threshold asserts a
# 422 rejection rather than a successful retrieval.
- pattern: "tests/integration/test_catalog_multi_source.py::*"
  capability_ids: [retrieval.async-retrieval-jobs]
  scenario_name: "Multi-source inline and SSE retrieval"
  exclude:
    - "*::test_catalog_kafka_ingestion_metadata"
    - "*::test_catalog_slack_ingestion_metadata"
    - "*::test_catalog_container_link_sets_dataset_container_urn"
    - "*::test_catalog_inline_large_object_hits_threshold"

# Justification: TestWorkroomCrudIsolation — create/get/list/update/archive
# workrooms. Every retained test creates one, either through the workroom_a /
# workroom_b fixtures or inline (test_archive_own_workroom).
# Excluded: the two Global-workroom guardrails read (test_global_workroom_exists)
# or assert a 403 (test_cannot_delete_global_workroom) against the pre-existing
# Global workroom — neither creates anything.
- pattern: "tests/integration/test_workroom_isolation_live.py::TestWorkroomCrudIsolation::*"
  capability_ids: [workrooms.create]
  scenario_name: "Workroom creation and CRUD lifecycle"
  exclude:
    - "*::test_global_workroom_exists"
    - "*::test_cannot_delete_global_workroom"

# ENG-12269: workroom isolation tests do not enter/leave a session or prove
# the documented 403 denial. A session-scoping mapping requires that workflow.

# Justification: test_federated_job_audit_actor_round_trip runs a job on the
# peer cluster through the mesh and proves the originating identity survives
# the round-trip (ENG-5784 two-cluster rig). Its own docstring pins the strict
# gate this mapping relies on: "status MUST be SUCCEEDED — accepting FAILED
# would mask the very failure modes this test exists to catch".
#
# The pattern names that one test rather than excluding its siblings, because
# this file is marker-gated (requires_two_clusters) and deselects wholesale on
# a single-cluster host — where an `exclude` glob could rot unverified. Two
# siblings are deliberately outside it:
#   * ::test_federated_job_run_via_mesh — asserts only isinstance(resp, dict),
#     so a job that ran and failed would still emit a passing record;
#   * test_m3_walkthrough_live.py's walkthrough — its step-8 assertion is
#     `result.status in {"SUCCEEDED", "FAILED"}`, explicitly accepting a
#     failed remote job. It is a strong audit-actor test but, by its own
#     assertion, not evidence that remote job execution succeeds.
- pattern: "tests/integration/test_federation_two_cluster_live.py::TestFederationTwoClusterWalkthrough::test_federated_job_audit_actor_round_trip"
  capability_ids: [federation.remote-jobs]
  scenario_name: "Federated job execution via mesh"

# Justification: test_skills_library_lifecycle_and_backing_store (ENG-11524)
# imports a real skill package, curates it, walks the full publication
# lifecycle (draft -> published -> archived -> draft), exports both the single
# package and a bundle, and soft-deletes — then reads BOTH backing stores
# directly to confirm what the API cannot show. Specifically: the skill_library
# row's content_checksum equals the sha256 of the bytes uploaded, the
# package.zip under that row's storage_path is byte-identical to them, and
# after DELETE the row is RETAINED with deleted_at set rather than destroyed.
# That last assertion is the only proof of the document's "deletion is soft"
# guarantee — DELETE answers success and later reads 404 either way.
#
# The pattern names that one test rather than the module. The module's three
# other tests must not stand in for it: two are rejection assertions (invalid
# package -> 400, duplicate import -> 409), and the third runs a skill's own
# script, which is not this capability's claim. Under the per-test rule,
# running any of them alone must never be able to emit a passing record here.
# Naming the single test is stronger than an exclude glob, which could rot
# unnoticed as siblings are added - as the count in this very comment did.
#
# The test carries requires_platform_store and skips as a unit when the store
# settings are absent, so an unconfigured host emits nothing rather than a
# passed_with_notes record claiming the store was verified. The lifecycle and
# store assertions are fused into one test for exactly that reason.
#
# When re-emitting this record, annotate --build with the SDK revision as well
# as the platform's: `...; kamiwaza-sdk <ref>@<sha>`, which is what 24 of the
# corpus's records already do. Without it the record names only the platform,
# and nothing in it can show that the assertions cited by the capability
# document were the ones that actually ran - a record collected before a test
# is strengthened proves something weaker than the document then claims, and
# only wall-clock comparison across two repos catches it.
# This entry is cycle-authored, not harvested: the store verification it
# relies on was written for ENG-11524 to evidence this capability. The
# pre-existing module covered the API lifecycle only, and never read either
# backing store.
- pattern: "tests/integration/test_skills_live.py::test_skills_library_lifecycle_and_backing_store"
  capability_ids: [skills.skills-library]
  scenario_name: "Skills Library import, curation, export and soft delete"
  evidence_provenance: cycle-authored

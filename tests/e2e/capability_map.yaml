# ENG-12269: the llama.cpp test deploys and serves one real chat request,
# establishing local deployment. The former module glob grouped independent
# GPU/co-location tests; on Azure only chat ran, yet the passing record named
# the broader OpenAI-compatible inference capability, whose document requires
# chat, embeddings, transcription, and image generation. Keep its status
# failed with explicit missing-operation steps until one scenario proves all.
- pattern: "tests/integration/test_inference_matrix_live.py::test_deploy_and_infer_llamacpp_gguf"
  capability_ids: [models.local-deployment]
  scenario_name: "Deploy llama.cpp model locally and serve chat"

# The same chat run is a valid *attempt* at the inference operation set but
# cannot pass it. The emitter adds named skipped steps for the absent required
# operations and derives failed, preserving a reviewable reasoned record.
- pattern: "tests/integration/test_inference_matrix_live.py::test_deploy_and_infer_llamacpp_gguf"
  capability_ids: [models.openai-compatible-inference]
  scenario_name: "OpenAI-compatible inference operation set"

# Justification: test_skills_library_lifecycle_and_backing_store (ENG-11524)
# imports a real skill package, curates it, walks the full publication
# lifecycle (draft -> published -> archived -> draft), exports both the single
# package and a bundle, and soft-deletes — then reads BOTH backing stores
# directly to confirm what the API cannot show. Specifically: the skill_library
# row's content_checksum equals the sha256 of the bytes uploaded, the
# package.zip under that row's storage_path is byte-identical to them, and
# after DELETE the row is RETAINED with deleted_at set rather than destroyed.
# That last assertion is the only proof of the document's "deletion is soft"
# guarantee — DELETE answers success and later reads 404 either way.
#
# The pattern names that one test rather than the module. The module's three
# other tests must not stand in for it: two are rejection assertions (invalid
# package -> 400, duplicate import -> 409), and the third runs a skill's own
# script, which is not this capability's claim. Under the per-test rule,
# running any of them alone must never be able to emit a passing record here.
# Naming the single test is stronger than an exclude glob, which could rot
# unnoticed as siblings are added - as the count in this very comment did.
#
# The test carries requires_platform_store and skips as a unit when the store
# settings are absent, so an unconfigured host emits nothing rather than a
# passed_with_notes record claiming the store was verified. The lifecycle and
# store assertions are fused into one test for exactly that reason.
#
# When re-emitting this record, annotate --build with the SDK revision as well
# as the platform's: `...; kamiwaza-sdk <ref>@<sha>`, which is what 24 of the
# corpus's records already do. Without it the record names only the platform,
# and nothing in it can show that the assertions cited by the capability
# document were the ones that actually ran - a record collected before a test
# is strengthened proves something weaker than the document then claims, and
# only wall-clock comparison across two repos catches it.
# This entry is cycle-authored, not harvested: the store verification it
# relies on was written for ENG-11524 to evidence this capability. The
# pre-existing module covered the API lifecycle only, and never read either
# backing store.
- pattern: "tests/integration/test_skills_live.py::test_skills_library_lifecycle_and_backing_store"
  capability_ids: [skills.skills-library]
  scenario_name: "Skills Library import, curation, export and soft delete"
  evidence_provenance: cycle-authored

# ENG-12432. platform.app-generation-path names four stations: scaffold
# (`kz-ext create`), the local loop (`kz-ext dev local`), `kz-ext validate`,
# and the deploy (`kz-ext dev`). The three cluster-free stations are covered by
# tests/integration/test_app_generation_path.py; the deploy needs a reachable
# instance AND an image registry the cluster can pull from, and is not
# evidenced. It is declared here as an unverified operation, which appends a
# skipped `required_operation:` step and derives `failed` — a reasoned partial
# record rather than silence, per ENG-12269.
#
# THIS IS THE ONE MODULE-GLOB ENTRY IN THE FILE AND IT IS DELIBERATE, so read
# the PER-TEST RULE against it carefully. The rule exists so that running a
# single matched test can never emit a PASSING record for the capability. Here
# that outcome is structurally impossible: `kz_ext_dev_deploy` is always a
# required-and-skipped step, so every record this entry can produce is
# `failed`, whichever subset of the three tests ran. The three are stations of
# one path measured in one run, and splitting them into three node-id entries
# would emit three records each claiming the whole capability from one station
# — strictly weaker. Revisit this shape when the deploy station lands: at that
# point the entry should name the single test that walks the full path.
- pattern: "tests/integration/test_app_generation_path.py::*"
  capability_ids: [platform.app-generation-path]
  scenario_name: "Application generation path: scaffold, validate, and local loop"
  evidence_provenance: cycle-authored
  unverified_operations: [kz_ext_dev_deploy]

# ENG-12432. The capability document defines this arm precisely: "resolve a
# template, deploy, poll status, and stop", plus a direct assertion of the
# reserved-environment-key boundary because that one is a security claim. The
# mapped test is exactly that run and nothing wider.
#
# Pinned to the single node-id, NOT the module. The sibling
# test_app_garden_catalog_and_image_readiness in the same file is deliberately
# unmapped: a catalog listing establishes nothing about deploying, and the
# ticket rules out a catalog-only pass. A module glob would have let that test
# alone emit a record for this capability.
#
# Scope a reader should know, since the kit marks a capability characterized on
# one passing record: this run establishes resolve/deploy/monitor/retire and
# the env-key boundary. It does NOT exercise install_by_name, the stable-HTTPS
# routing guarantee, or ephemeral session purging. Those are guarantees of the
# document that no evidence covers yet -- they are candidates for a second
# mapped test, not a reason to withhold this one, which is the arm the document
# asks for.
- pattern: "tests/integration/test_app_garden_lifecycle_live.py::test_app_garden_deploy_lifecycle_and_reserved_env_keys"
  capability_ids: [apps.app-garden]
  scenario_name: "App Garden deploy lifecycle and reserved environment-key boundary"
  evidence_provenance: cycle-authored

# ENG-12432. The capability document's arm: list templates, deploy one, assert
# it reports healthy over MCP and appears in discovery, then stop it.
#
# MCP responsiveness is established by a real JSON-RPC `initialize` handshake
# against the deployment's ADVERTISED URL, NOT by GET /tool/deployment/{id}/health.
# That endpoint answers from the deployment's status field and reports a
# hardcoded protocol_version without contacting the tool, so asserting it after
# polling for DEPLOYED would be bounded by construction and could never fail.
# The handshake asserts a JSON-RPC result carrying protocolVersion and
# serverInfo -- values no status field can produce -- and asserts the response
# is JSON, because the gateway answers an unknown path under a tool's route
# with 200 and dashboard HTML rather than 404. Both guards are mutation-checked.
#
# Scope this record does NOT establish, so a characterized status is not read
# wider than it earns:
#   * the missing-required-environment-variable failure mode. No IMPORTED
#     template on the evidence host declares required_env_vars, and importing
#     one would mutate a shared catalogue, so its test skips with that reason.
#   * whether discovery is filtered to running servers. It is not -- it returns
#     STOPPED and FAILED records too -- but the document's heading and body
#     disagree on whether it should, so the test asserts only that the
#     deployment under test is discoverable and leaves the question to the
#     document's owner rather than settling it whichever way passes.
#   * the deploy-from-image path; only deploy-from-template is exercised.
#
# Template selection is host-dependent: the arm takes the first imported,
# cluster-pullable template with no required variables. On this host that is an
# MCP server; a host whose first match serves no /mcp would fail the
# content-type guard, which is the correct outcome and not a flake.
- pattern: "tests/integration/test_tool_shed_lifecycle_live.py::test_tool_shed_deploy_health_discovery_and_stop"
  capability_ids: [tools.mcp-tool-shed]
  scenario_name: "Tool Shed deploy, MCP protocol handshake, discovery and stop"
  evidence_provenance: cycle-authored

# ENG-12432. extensions.developer-path asks whether a customer's own developers
# can extend the platform. Its guarantees are toolchain scaffolding, a real
# iterate loop that builds and pushes, a published extension becoming a platform
# resource, and a documented guide.
#
# `kz_ext_dev_deploy` is declared unverified, so every record this entry can emit
# derives failed with a named skipped step. The deploy stage was exercised by
# hand on the evidence host and did not complete; the reason is recorded with the
# staged evidence, which is internal. It is declared here rather than silently
# omitted so the record states which station is missing instead of implying the
# whole path was walked.
#
# This is a module glob for the same reason as the app-generation entry: the two
# matched tests are stations of one path measured together, and while
# kz_ext_dev_deploy is declared no subset of them can emit a passing record. Both
# tests are needed for the claim -- the scaffold alone says nothing about the
# platform resource, and the platform resource alone says nothing about kz-ext.
#
# Deliberately NOT mapped here: tests/integration/test_extensions_live.py. It
# exercises the extension API's CRUD and error paths without invoking the
# toolchain at all, and a capability about kz-ext cannot be established by calls
# that never run it.
- pattern: "tests/integration/test_extension_developer_path_live.py::*"
  capability_ids: [extensions.developer-path]
  scenario_name: "Extension developer path: toolchain scaffold and platform resource"
  evidence_provenance: cycle-authored
  unverified_operations: [kz_ext_dev_deploy]

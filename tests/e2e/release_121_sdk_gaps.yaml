    state: fixture-blocked
    probe: tests/integration/test_app_garden_lifecycle_live.py::test_app_garden_deploy_ready_and_stop
    next: Supply an approved disposable template; add URL and reserved-key assertions.
  - id: auth.enterprise-sso
    state: rig-blocked
    next: Provision an external OIDC or SAML IdP and verify login, claims, and session.
  - id: authz.rebac-access-control
    state: partial
    probe: tests/integration/test_authz_live.py::test_rebac_grant_check_revoke_live
    next: Add dataset attribute-gate retrieval and decision-audit assertions.
  - id: connectors.managed-data-sources
    state: producer-missing
    next: Create, update, disable, verify, and delete a disposable connector type.
  - id: connectors.workroom-surface-access

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-gates"
version = "1.1.0"
description = "Test-fixture gate package for SDK federation validation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["acme_gates*"]
